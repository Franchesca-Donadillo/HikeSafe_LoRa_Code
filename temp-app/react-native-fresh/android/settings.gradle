pluginManagement {
  def reactNativeGradlePlugin
  try {
    def stdout = new ByteArrayOutputStream()
    def stderr = new ByteArrayOutputStream()
    def rc = exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
      standardOutput = stdout
      errorOutput = stderr
      ignoreExitValue = true
    }
    def outText = stdout.toString().trim()
    def errText = stderr.toString().trim()
    if (rc.exitValue != 0 || outText == '') {
      println "--- ERROR resolving @react-native/gradle-plugin via node ---"
      println "exit:${rc.exitValue} stdout:\n" + outText
      println "stderr:\n" + errText
      throw new GradleException("Failed to resolve @react-native/gradle-plugin (see logs)")
    }
    reactNativeGradlePlugin = new File(outText).getParentFile().absolutePath
  } catch (Exception e) {
    println "--- ERROR resolving @react-native/gradle-plugin via node (catch) ---"
    println e.message
    throw new GradleException("Failed to resolve @react-native/gradle-plugin: " + e.message)
  }
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath
  try {
    def stdout2 = new ByteArrayOutputStream()
    def stderr2 = new ByteArrayOutputStream()
    def rc2 = exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
      standardOutput = stdout2
      errorOutput = stderr2
      ignoreExitValue = true
    }
    def outText2 = stdout2.toString().trim()
    def errText2 = stderr2.toString().trim()
    if (rc2.exitValue != 0 || outText2 == '') {
      println "--- ERROR resolving expo-modules-autolinking via node ---"
      println "exit:${rc2.exitValue} stdout:\n" + outText2
      println "stderr:\n" + errText2
      throw new GradleException("Failed to resolve expo-modules-autolinking (see logs)")
    }
    expoPluginsPath = new File(outText2, "../android/expo-gradle-plugin").absolutePath
  } catch (Exception e) {
    println "--- ERROR resolving expo-modules-autolinking via node (catch) ---"
    println e.message
    throw new GradleException("Failed to resolve expo-modules-autolinking: " + e.message)
  }
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'HikeSafe'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
